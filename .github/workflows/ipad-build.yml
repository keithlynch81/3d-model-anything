name: Build signed iPad app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Intel hosts can cross-compile for iPad; avoid the constrained ARM runner pool.
    runs-on: macos-15-intel
    timeout-minutes: 30
    environment: ipad-signing
    env:
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: |
          for name in APP_BUNDLE_ID APPLE_TEAM_ID CERTIFICATE PASSWORD PROFILE; do
            if [ -z "${!name}" ]; then echo "::error::Missing configuration: $name"; exit 1; fi
          done
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          cd apps/house-capture
          xcodegen generate
      - name: Install signing assets
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: python3 tools/ipad-signing.py
      - name: Archive Release app
        run: |
          xcodebuild archive \
            -project apps/house-capture/HouseCapture.xcodeproj \
            -scheme HouseCapture -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HouseCapture.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/ipad-signing.keychain-db" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Export installable IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HouseCapture.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipad-export"
      - uses: actions/upload-artifact@v4
        with:
          name: ipad-app-${{ github.run_number }}
          path: ${{ runner.temp }}/ipad-export/*.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Remove signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ipad-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/profile.mobileprovision"
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
